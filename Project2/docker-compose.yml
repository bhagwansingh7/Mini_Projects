services:
  backend:
    build:
      context: ./Backend
    ports:
      - "3200:3200"
    environment:
      PORT: 3200
      DB_HOST: mysql_db2
      DB_USER: root
      DB_PASSWORD: Bhagwan123
      DB_PORT: 3306
      DB_NAME: student_db2
    depends_on:
      mysql_db2:
        condition: service_healthy

  mysql_db2:
    image: mysql:latest
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Bhagwan123
      MYSQL_DATABASE: student_db2
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pBhagwan123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: